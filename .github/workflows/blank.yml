name: Python DevOps CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
   
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # هنا سيقوم الروبوت بتثبيت أي مكتبات تحتاجها مستقبلاً
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Python Script Check
      run: |
        # هذا الأمر يتأكد أن كود البايثون سليم ولا يوجد به أخطاء كتابية
        python -m compileall .
